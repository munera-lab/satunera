[workspace]
resolver = "2"
members = ["crates/satunera-contracts"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.49", default-features = false }
thiserror = "2"

[profile.dev]
opt-level = 1
